name: 🚀 Build Ryou Player APK

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.11.1'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

permissions:
  contents: write
  packages: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # BUILD DEBUG APK
  # ────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: 🐛 Build Debug APK
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_type == 'debug' ||
      github.event.inputs.build_type == 'both'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 📋 Set build metadata
        id: meta
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date +'%Y%m%d')
          VERSION_NAME="v1.0.${BUILD_DATE}-build${BUILD_NUMBER}"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "COMMIT_HASH=${COMMIT_HASH}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION_NAME} | Commit: ${COMMIT_HASH}"

      - name: 🔧 Setup Gradle ${{ env.GRADLE_VERSION }}
        run: |
          # Download Gradle distribution
          GRADLE_ZIP="gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_URL="https://services.gradle.org/distributions/${GRADLE_ZIP}"
          echo "Downloading Gradle ${GRADLE_VERSION}..."
          curl -fsSL "$GRADLE_URL" -o "/tmp/${GRADLE_ZIP}"

          # Extract
          unzip -q "/tmp/${GRADLE_ZIP}" -d /tmp/gradle_dist
          GRADLE_HOME="/tmp/gradle_dist/gradle-${GRADLE_VERSION}"
          echo "GRADLE_HOME=${GRADLE_HOME}" >> $GITHUB_ENV
          echo "${GRADLE_HOME}/bin" >> $GITHUB_PATH

          # Copy the correct wrapper jar from distribution
          cp "${GRADLE_HOME}/lib/gradle-wrapper-${GRADLE_VERSION}.jar" \
             gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
          cp "${GRADLE_HOME}/lib/plugins/gradle-wrapper-${GRADLE_VERSION}.jar" \
             gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
          find "${GRADLE_HOME}" -name "*wrapper*.jar" | head -1 | \
             xargs -I{} cp {} gradle/wrapper/gradle-wrapper.jar

          echo "✅ Gradle ${GRADLE_VERSION} ready"
          gradle --version
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 🐘 Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ env.GRADLE_VERSION }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ env.GRADLE_VERSION }}-
            ${{ runner.os }}-gradle-

      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.BUILD_NUMBER }}
          COMMIT_HASH: ${{ steps.meta.outputs.COMMIT_HASH }}

      - name: 🔍 Run Lint (non-blocking)
        run: ./gradlew lintDebug --continue || true
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.BUILD_NUMBER }}
          COMMIT_HASH: ${{ steps.meta.outputs.COMMIT_HASH }}

      - name: 📝 Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Found: $APK_PATH"
          NEW_NAME="RyouPlayer-debug-${{ steps.meta.outputs.VERSION_NAME }}.apk"
          cp "$APK_PATH" "app/build/outputs/apk/debug/${NEW_NAME}"
          echo "✅ Debug APK: ${NEW_NAME}"

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RyouPlayer-debug-${{ steps.meta.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/debug/RyouPlayer-debug-*.apk
          retention-days: 14

      - name: 📊 Upload Lint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results-debug
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # BUILD RELEASE APK
  # ────────────────────────────────────────────────────────────────────────────
  build-release:
    name: 🚀 Build Release APK
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_type == 'release' ||
      github.event.inputs.build_type == 'both'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 📋 Set build metadata
        id: meta
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date +'%Y%m%d')
          VERSION_NAME="v1.0.${BUILD_DATE}-build${BUILD_NUMBER}"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "COMMIT_HASH=${COMMIT_HASH}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION_NAME} | Commit: ${COMMIT_HASH}"

      - name: 🔧 Setup Gradle ${{ env.GRADLE_VERSION }}
        run: |
          GRADLE_ZIP="gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_URL="https://services.gradle.org/distributions/${GRADLE_ZIP}"
          echo "Downloading Gradle ${GRADLE_VERSION}..."
          curl -fsSL "$GRADLE_URL" -o "/tmp/${GRADLE_ZIP}"

          unzip -q "/tmp/${GRADLE_ZIP}" -d /tmp/gradle_dist
          GRADLE_HOME="/tmp/gradle_dist/gradle-${GRADLE_VERSION}"
          echo "GRADLE_HOME=${GRADLE_HOME}" >> $GITHUB_ENV
          echo "${GRADLE_HOME}/bin" >> $GITHUB_PATH

          cp "${GRADLE_HOME}/lib/gradle-wrapper-${GRADLE_VERSION}.jar" \
             gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
          cp "${GRADLE_HOME}/lib/plugins/gradle-wrapper-${GRADLE_VERSION}.jar" \
             gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
          find "${GRADLE_HOME}" -name "*wrapper*.jar" | head -1 | \
             xargs -I{} cp {} gradle/wrapper/gradle-wrapper.jar

          echo "✅ Gradle ${GRADLE_VERSION} ready"
          gradle --version
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 🐘 Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ env.GRADLE_VERSION }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ env.GRADLE_VERSION }}-
            ${{ runner.os }}-gradle-

      - name: 🔑 Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
            echo "✅ Keystore decoded ($(stat -c%s app/keystore/release.keystore) bytes)"
          else
            echo "⚠️ KEYSTORE_BASE64 not set — APK will be unsigned"
          fi

      - name: 📝 Create signing.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            cat > signing.properties <<EOF
          storeFile=keystore/release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
            echo "✅ signing.properties created"
          else
            echo "⚠️ Signing secrets not set"
          fi

      - name: 🏗️ Build Release APK
        run: ./gradlew assembleRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.BUILD_NUMBER }}
          COMMIT_HASH: ${{ steps.meta.outputs.COMMIT_HASH }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 📝 Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          NEW_NAME="RyouPlayer-release-${{ steps.meta.outputs.VERSION_NAME }}.apk"
          cp "$APK_PATH" "app/build/outputs/apk/release/${NEW_NAME}"
          echo "✅ Release APK: ${NEW_NAME}"

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RyouPlayer-release-${{ steps.meta.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/release/RyouPlayer-release-*.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release Draft
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.VERSION_NAME }}
          name: "🎬 Ryou Player ${{ steps.meta.outputs.VERSION_NAME }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: app/build/outputs/apk/release/RyouPlayer-release-*.apk
          body: |
            ## 🎬 Ryou Player ${{ steps.meta.outputs.VERSION_NAME }}

            **Build:** #${{ steps.meta.outputs.BUILD_NUMBER }}
            **Commit:** `${{ steps.meta.outputs.COMMIT_HASH }}`
            **Date:** ${{ steps.meta.outputs.BUILD_DATE }}

            ### 📱 Requirements
            - Android 12+ (API 31)
            - ARM64 / x86_64

            ---
            > 🤖 Auto-generated by GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
