name: 🚀 Build Ryou Player APK

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both

env:
  JAVA_VERSION: '17'
  GRADLE_TARGET: '8.11.1'

permissions:
  contents: write
  packages: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # BUILD DEBUG APK
  # ────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: 🐛 Build Debug APK
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_type == 'debug' ||
      github.event.inputs.build_type == 'both'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 📋 Set build metadata
        id: meta
        run: |
          # BUILD_NUMBER = github.run_number (no offset) so workflow build# = release build# = versionCode
          BUILD_NUMBER=${{ github.run_number }}
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date +'%Y%m%d')
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "COMMIT_HASH=${COMMIT_HASH}"   >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}"     >> $GITHUB_OUTPUT
          echo "📦 Commit: ${COMMIT_HASH} | Build: ${BUILD_NUMBER}"

      - name: 🔧 Generate Gradle Wrapper
        run: |
          echo "System Gradle version:"
          gradle --version | grep "^Gradle"
          echo "Generating wrapper for Gradle ${GRADLE_TARGET}..."
          gradle wrapper \
            --gradle-version "${GRADLE_TARGET}" \
            --distribution-type bin
          chmod +x gradlew
          echo "✅ Wrapper generated"
          ls -lh gradle/wrapper/

      - name: 🐘 Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ env.GRADLE_TARGET }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ env.GRADLE_TARGET }}-
            ${{ runner.os }}-gradle-

      - name: 📦 Cache MPV native libs
        id: cache-mpv
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: mpv-libs-2026-04-25-arm64-v8a-v2

      - name: 🎬 Download MPV native libs
        if: steps.cache-mpv.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/download_mpv_libs.sh
          ./scripts/download_mpv_libs.sh

      - name: 🏗️ Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dorg.gradle.parallel=true
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.BUILD_NUMBER }}
          COMMIT_HASH:  ${{ steps.meta.outputs.COMMIT_HASH }}

      # ── Read the canonical version name that Gradle baked into the APK ──────
      # This is the single source of truth for all artifact names and release
      # tags, so the APK filename / artifact name / About screen all match.
      - name: 📌 Read canonical version from Gradle
        id: version
        run: |
          VERSION=$(./gradlew -q :app:printVersionName --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2g")
          echo "VERSION_NAME=v${VERSION}" >> $GITHUB_OUTPUT
          echo "📌 Canonical version: v${VERSION}"
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.BUILD_NUMBER }}
          COMMIT_HASH:  ${{ steps.meta.outputs.COMMIT_HASH }}

      - name: 🔍 Run Lint (non-blocking)
        run: |
          ./gradlew lintDebug \
            --no-daemon \
            --continue \
            -Dorg.gradle.jvmargs="-Xmx4g" || true
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.BUILD_NUMBER }}
          COMMIT_HASH:  ${{ steps.meta.outputs.COMMIT_HASH }}

      - name: 📝 Rename APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Found APK: $APK"
          NEW="RyouPlayer-debug-${{ steps.version.outputs.VERSION_NAME }}.apk"
          cp "$APK" "app/build/outputs/apk/debug/${NEW}"
          echo "✅ Renamed to: ${NEW}"

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RyouPlayer-debug-${{ steps.version.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/debug/RyouPlayer-debug-*.apk
          retention-days: 14

      - name: 📊 Upload Lint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results-debug
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # BUILD RELEASE APK
  # ────────────────────────────────────────────────────────────────────────────
  build-release:
    name: 🚀 Build Release APK
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_type == 'release' ||
      github.event.inputs.build_type == 'both'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 📋 Set build metadata
        id: meta
        run: |
          # BUILD_NUMBER = github.run_number (no offset) so workflow build# = release build# = versionCode
          BUILD_NUMBER=${{ github.run_number }}
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date +'%Y%m%d')
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "COMMIT_HASH=${COMMIT_HASH}"   >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}"     >> $GITHUB_OUTPUT
          echo "📦 Commit: ${COMMIT_HASH} | Build: ${BUILD_NUMBER}"

      - name: 🔧 Generate Gradle Wrapper
        run: |
          gradle wrapper \
            --gradle-version "${GRADLE_TARGET}" \
            --distribution-type bin
          chmod +x gradlew

      - name: 🐘 Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ env.GRADLE_TARGET }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ env.GRADLE_TARGET }}-
            ${{ runner.os }}-gradle-

      - name: 📦 Cache MPV native libs
        id: cache-mpv
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: mpv-libs-2026-04-25-arm64-v8a-v2

      - name: 🎬 Download MPV native libs
        if: steps.cache-mpv.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/download_mpv_libs.sh
          ./scripts/download_mpv_libs.sh

      - name: 🔑 Prepare Signing Keystore
        env:
          KEYSTORE_BASE64:  ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app/keystore

          ALIAS="${KEY_ALIAS:-ryoualias123}"
          VALID=false

          # ── Step 1: decode the base64 keystore ──────────────────────────────
          # Root cause of "corrupt" keystore: GitHub Secrets may inject trailing
          # newlines, and multi-line base64 (with \n every 76 chars) is also common.
          # Solution: strip ALL whitespace before decoding.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "🔑 Decoding keystore from KEYSTORE_BASE64..."
            # Python is more reliable than tr+base64 for stripping all whitespace
            python3 -c "
          import base64, os, sys
          raw = os.environ['KEYSTORE_BASE64']
          # Strip ALL whitespace characters (spaces, newlines, carriage returns, tabs)
          cleaned = ''.join(raw.split())
          try:
              data = base64.b64decode(cleaned)
              sys.stdout.buffer.write(data)
          except Exception as e:
              sys.stderr.write(f'base64 decode failed: {e}\n')
              sys.exit(1)
          " > app/keystore/release.keystore
            BYTES=$(stat -c%s app/keystore/release.keystore 2>/dev/null || echo 0)
            echo "Decoded keystore: ${BYTES} bytes"
            if [ "$BYTES" -lt 100 ]; then
              echo "❌ Decoded file too small (${BYTES} bytes) — KEYSTORE_BASE64 may be corrupt"
              rm -f app/keystore/release.keystore
            fi
          fi

          # ── Step 2: validate with keytool ────────────────────────────────────
          if [ -f app/keystore/release.keystore ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "🔍 Validating keystore with keytool..."
            if keytool -list \
                  -keystore app/keystore/release.keystore \
                  -storepass "$KEYSTORE_PASSWORD" \
                  -noprompt 2>&1; then
              VALID=true
              echo "✅ Keystore is valid"
            else
              echo "❌ keytool rejected keystore — will auto-generate a new one"
              echo "   Possible causes:"
              echo "   1. KEYSTORE_PASSWORD secret is wrong"
              echo "   2. KEYSTORE_BASE64 was corrupted during copy-paste"
              echo "   3. The keystore file is JKS but storeType=PKCS12 (or vice versa)"
              rm -f app/keystore/release.keystore
            fi
          fi

          # ── Step 3: auto-generate if still not valid ─────────────────────────
          if [ "$VALID" = "false" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "🔧 Auto-generating new PKCS12 keystore..."
            rm -f app/keystore/release.keystore
            keytool -genkey -v \
              -keystore app/keystore/release.keystore \
              -storetype PKCS12 \
              -alias     "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass   "$KEY_PASSWORD" \
              -dname "CN=RyouStream,O=RyouStream,C=ID" \
              -noprompt
            BYTES=$(stat -c%s app/keystore/release.keystore 2>/dev/null || echo 0)
            echo "✅ Generated new keystore (${BYTES} bytes)"
            echo ""
            echo "════════════════════════════════════════════════"
            echo "⚠️  ACTION REQUIRED: Update KEYSTORE_BASE64 secret"
            echo "════════════════════════════════════════════════"
            echo "Run this locally or copy the value below to"
            echo "GitHub → Settings → Secrets → KEYSTORE_BASE64:"
            echo ""
            base64 -w 0 app/keystore/release.keystore
            echo ""
            echo "════════════════════════════════════════════════"
            VALID=true
          fi

          # ── Step 4: detect actual store type ─────────────────────────────────
          # Detect whether it's actually PKCS12 or JKS so storeType is correct.
          STORE_TYPE="PKCS12"
          if file app/keystore/release.keystore 2>/dev/null | grep -qi "java keystore"; then
            STORE_TYPE="JKS"
            echo "ℹ️  Detected JKS format — converting to PKCS12 for compatibility..."
            keytool -importkeystore \
                  -srckeystore  app/keystore/release.keystore \
                  -srcstorepass "$KEYSTORE_PASSWORD" \
                  -srcalias     "$ALIAS" \
                  -destkeystore app/keystore/release.p12 \
                  -deststoretype PKCS12 \
                  -deststorepass "$KEYSTORE_PASSWORD" \
                  -destalias    "$ALIAS" \
                  -noprompt 2>&1 && \
            mv app/keystore/release.p12 app/keystore/release.keystore && \
            echo "✅ Converted JKS → PKCS12" || \
            echo "⚠️  Conversion failed, keeping original format"
          fi

          # ── Step 5: write signing.properties ─────────────────────────────────
          # PKCS12 CRITICAL: keyPassword must equal storePassword.
          # Android's KeystoreHelper uses keyPassword to decrypt the private key.
          # If they differ, you get: "Given final block not properly padded" (BadPaddingException).
          # For PKCS12, keytool ignores -keypass at creation and always uses storepass.
          # So we always write keyPassword=storePassword here.
          if [ -f app/keystore/release.keystore ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            {
              echo "storeFile=keystore/release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$ALIAS"
              echo "keyPassword=$KEYSTORE_PASSWORD"
              echo "storeType=PKCS12"
            } > signing.properties
            echo "✅ signing.properties written"
          else
            echo "❌ Cannot write signing.properties — keystore or password missing"
            echo "   Set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD secrets"
            exit 1
          fi

      - name: 🏗️ Build Release APK
        run: |
          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dorg.gradle.parallel=true
        env:
          BUILD_NUMBER:      ${{ steps.meta.outputs.BUILD_NUMBER }}
          COMMIT_HASH:       ${{ steps.meta.outputs.COMMIT_HASH }}
          KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}

      # ── Read the canonical version name that Gradle baked into the APK ──────
      - name: 📌 Read canonical version from Gradle
        id: version
        run: |
          VERSION=$(./gradlew -q :app:printVersionName --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2g")
          echo "VERSION_NAME=v${VERSION}" >> $GITHUB_OUTPUT
          echo "📌 Canonical version: v${VERSION}"
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.BUILD_NUMBER }}
          COMMIT_HASH:  ${{ steps.meta.outputs.COMMIT_HASH }}

      - name: 📝 Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          NEW="RyouPlayer-release-${{ steps.version.outputs.VERSION_NAME }}.apk"
          cp "$APK" "app/build/outputs/apk/release/${NEW}"
          echo "✅ Renamed to: ${NEW}"

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RyouPlayer-release-${{ steps.version.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/release/RyouPlayer-release-*.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release Draft
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION_NAME }}
          name: "🎬 Ryou Player ${{ steps.version.outputs.VERSION_NAME }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: app/build/outputs/apk/release/RyouPlayer-release-*.apk
          body: |
            ## 🎬 Ryou Player ${{ steps.version.outputs.VERSION_NAME }}

            **Build:** #${{ steps.meta.outputs.BUILD_NUMBER }}
            **Commit:** `${{ steps.meta.outputs.COMMIT_HASH }}`
            **Date:** ${{ steps.meta.outputs.BUILD_DATE }}

            ### 📱 Requirements
            - Android 12+ (API 31)
            - ARM64

            ---
            > 🤖 Auto-generated by GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
