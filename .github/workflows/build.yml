name: 🚀 Build Ryou Player APK

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # BUILD DEBUG APK
  # ────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: 🐛 Build Debug APK
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_type == 'debug' ||
      github.event.inputs.build_type == 'both'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: 📋 Set build metadata
        id: meta
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date +'%Y%m%d')
          VERSION_NAME="v1.0.${BUILD_DATE}-build${BUILD_NUMBER}"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "COMMIT_HASH=${COMMIT_HASH}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION_NAME} | Commit: ${COMMIT_HASH}"

      - name: 🔧 Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: 🐘 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔍 Run Lint
        run: ./gradlew lintDebug --continue
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.BUILD_NUMBER }}
          COMMIT_HASH: ${{ steps.meta.outputs.COMMIT_HASH }}

      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.BUILD_NUMBER }}
          COMMIT_HASH: ${{ steps.meta.outputs.COMMIT_HASH }}

      - name: 📝 Rename Debug APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          NEW_NAME="RyouPlayer-debug-${{ steps.meta.outputs.VERSION_NAME }}.apk"
          cp "$APK_PATH" "app/build/outputs/apk/debug/${NEW_NAME}"
          echo "APK_FILE=${NEW_NAME}" >> $GITHUB_ENV
          echo "✅ Debug APK: ${NEW_NAME}"

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RyouPlayer-debug-${{ steps.meta.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/debug/RyouPlayer-debug-*.apk
          retention-days: 14

      - name: 📊 Upload Lint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results-debug
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # BUILD RELEASE APK
  # ────────────────────────────────────────────────────────────────────────────
  build-release:
    name: 🚀 Build Release APK
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_type == 'release' ||
      github.event.inputs.build_type == 'both'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: 📋 Set build metadata
        id: meta
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date +'%Y%m%d')
          VERSION_NAME="v1.0.${BUILD_DATE}-build${BUILD_NUMBER}"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "COMMIT_HASH=${COMMIT_HASH}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: 🔧 Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: 🐘 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔑 Set up Keystore from GitHub Secret
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          echo "✅ Keystore decoded"

      - name: 📝 Create signing.properties
        if: env.KEYSTORE_PASSWORD != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > signing.properties << EOF
          storeFile=keystore/release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          echo "✅ signing.properties created"

      - name: 🏗️ Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.BUILD_NUMBER }}
          COMMIT_HASH: ${{ steps.meta.outputs.COMMIT_HASH }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 📝 Rename Release APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          NEW_NAME="RyouPlayer-release-${{ steps.meta.outputs.VERSION_NAME }}.apk"
          cp "$APK_PATH" "app/build/outputs/apk/release/${NEW_NAME}"
          echo "✅ Release APK: ${NEW_NAME}"

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RyouPlayer-release-${{ steps.meta.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/release/RyouPlayer-release-*.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release (on push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.VERSION_NAME }}
          name: "Ryou Player ${{ steps.meta.outputs.VERSION_NAME }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: app/build/outputs/apk/release/RyouPlayer-release-*.apk
          body: |
            ## 🎬 Ryou Player ${{ steps.meta.outputs.VERSION_NAME }}

            **Build:** #${{ steps.meta.outputs.BUILD_NUMBER }}
            **Commit:** `${{ steps.meta.outputs.COMMIT_HASH }}`
            **Date:** ${{ steps.meta.outputs.BUILD_DATE }}

            ### 📦 Downloads
            - `RyouPlayer-release-*.apk` — Signed release APK

            ### ✅ Requirements
            - Android 12+ (API 31)
            - ARM64 / x86_64

            ---
            > Auto-generated by GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
