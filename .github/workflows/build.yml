name: 🚀 Build Ryou Player APK

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.11.1'

permissions:
  contents: write
  packages: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # BUILD DEBUG APK
  # ────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: 🐛 Build Debug APK
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_type == 'debug' ||
      github.event.inputs.build_type == 'both'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 🔧 Setup Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: 📋 Set build metadata
        id: meta
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date +'%Y%m%d')
          VERSION_NAME="v1.0.${BUILD_DATE}-build${BUILD_NUMBER}"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "COMMIT_HASH=${COMMIT_HASH}"   >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}"     >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION_NAME} | Commit: ${COMMIT_HASH}"

      - name: 🔧 Generate Gradle Wrapper
        run: |
          echo "System Gradle version:"
          gradle --version | head -2
          echo "Generating wrapper for Gradle ${{ env.GRADLE_VERSION }}..."
          gradle wrapper \
            --gradle-version "${{ env.GRADLE_VERSION }}" \
            --distribution-type bin
          chmod +x gradlew
          echo "✅ Wrapper generated"
          ls -lh gradle/wrapper/

      - name: 📦 Cache MPV native libs
        id: cache-mpv
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: mpv-libs-2026-04-25-arm64-v8a-v2

      - name: 🎬 Download MPV native libs
        if: steps.cache-mpv.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/download_mpv_libs.sh
          ./scripts/download_mpv_libs.sh

      - name: 🏗️ Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dorg.gradle.parallel=true
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.BUILD_NUMBER }}
          COMMIT_HASH:  ${{ steps.meta.outputs.COMMIT_HASH }}

      - name: 🔍 Run Lint (non-blocking)
        run: |
          ./gradlew lintDebug \
            --no-daemon \
            --continue \
            -Dorg.gradle.jvmargs="-Xmx4g" || true
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.BUILD_NUMBER }}
          COMMIT_HASH:  ${{ steps.meta.outputs.COMMIT_HASH }}

      - name: 📝 Rename APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Found APK: $APK"
          NEW="RyouPlayer-debug-${{ steps.meta.outputs.VERSION_NAME }}.apk"
          cp "$APK" "app/build/outputs/apk/debug/${NEW}"
          echo "✅ Renamed to: ${NEW}"

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RyouPlayer-debug-${{ steps.meta.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/debug/RyouPlayer-debug-*.apk
          retention-days: 14

      - name: 📊 Upload Lint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results-debug
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # BUILD RELEASE APK
  # ────────────────────────────────────────────────────────────────────────────
  build-release:
    name: 🚀 Build Release APK
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_type == 'release' ||
      github.event.inputs.build_type == 'both'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 🔧 Setup Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: 📋 Set build metadata
        id: meta
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date +'%Y%m%d')
          VERSION_NAME="v1.0.${BUILD_DATE}-build${BUILD_NUMBER}"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "COMMIT_HASH=${COMMIT_HASH}"   >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}"     >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION_NAME} | Commit: ${COMMIT_HASH}"

      - name: 🔧 Generate Gradle Wrapper
        run: |
          gradle wrapper \
            --gradle-version "${{ env.GRADLE_VERSION }}" \
            --distribution-type bin
          chmod +x gradlew

      - name: 📦 Cache MPV native libs
        id: cache-mpv
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: mpv-libs-2026-04-25-arm64-v8a-v2

      - name: 🎬 Download MPV native libs
        if: steps.cache-mpv.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/download_mpv_libs.sh
          ./scripts/download_mpv_libs.sh

      - name: 🔑 Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > app/keystore/release.keystore
            echo "✅ Keystore decoded: $(stat -c%s app/keystore/release.keystore) bytes"
          else
            echo "⚠️ KEYSTORE_BASE64 not set — APK will be unsigned"
          fi

      - name: 📝 Create signing.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            MAGIC=$(od -A n -N 4 -t x1 app/keystore/release.keystore \
                    | tr -d ' \n' | tr '[:upper:]' '[:lower:]')
            if [[ "$MAGIC" == feedfeed* ]] || [[ "$MAGIC" == cececece* ]]; then
              STORE_TYPE="JKS"
            else
              STORE_TYPE="PKCS12"
            fi
            echo "🔑 Keystore format: $STORE_TYPE (magic=$MAGIC)"
            cat > signing.properties <<EOF
storeFile=keystore/release.keystore
storePassword=${KEYSTORE_PASSWORD}
keyAlias=${KEY_ALIAS}
keyPassword=${KEY_PASSWORD}
storeType=${STORE_TYPE}
EOF
            echo "✅ signing.properties created (storeType=$STORE_TYPE)"
          fi

      - name: 🏗️ Build Release APK
        run: |
          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dorg.gradle.parallel=true
        env:
          BUILD_NUMBER:      ${{ steps.meta.outputs.BUILD_NUMBER }}
          COMMIT_HASH:       ${{ steps.meta.outputs.COMMIT_HASH }}
          KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}

      - name: 📝 Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          NEW="RyouPlayer-release-${{ steps.meta.outputs.VERSION_NAME }}.apk"
          cp "$APK" "app/build/outputs/apk/release/${NEW}"
          echo "✅ Renamed to: ${NEW}"

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RyouPlayer-release-${{ steps.meta.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/release/RyouPlayer-release-*.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release Draft
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.VERSION_NAME }}
          name: "🎬 Ryou Player ${{ steps.meta.outputs.VERSION_NAME }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: app/build/outputs/apk/release/RyouPlayer-release-*.apk
          body: |
            ## 🎬 Ryou Player ${{ steps.meta.outputs.VERSION_NAME }}

            **Build:** #${{ steps.meta.outputs.BUILD_NUMBER }}
            **Commit:** `${{ steps.meta.outputs.COMMIT_HASH }}`
            **Date:** ${{ steps.meta.outputs.BUILD_DATE }}

            ### 📱 Requirements
            - Android 12+ (API 31)
            - ARM64 / x86_64

            ---
            > 🤖 Auto-generated by GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
