name: "🔑 Setup Signing Secrets (Run Once)"

on:
  workflow_dispatch:

jobs:
  setup-secrets:
    name: "🔑 Set GitHub Secrets for APK Signing"
    runs-on: ubuntu-latest

    steps:
      - name: "🔑 Set all signing secrets via gh CLI"
        env:
          GH_TOKEN: ${{ secrets.SETUP_TOKEN }}
        run: |
          REPO="ryoustream/RyouPlayer"

          echo "Setting KEYSTORE_PASSWORD..."
          printf '%s' 'defaultryoustream' | gh secret set KEYSTORE_PASSWORD --repo "$REPO"

          echo "Setting KEY_ALIAS..."
          printf '%s' 'ryoustream' | gh secret set KEY_ALIAS --repo "$REPO"

          echo "Setting KEY_PASSWORD..."
          printf '%s' 'defaultryoustream' | gh secret set KEY_PASSWORD --repo "$REPO"

          echo "Setting KEYSTORE_BASE64..."
          printf '%s' '' | gh secret set KEYSTORE_BASE64 --repo "$REPO"

          echo "All 4 secrets set!"

      - name: "Verify secrets"
        env:
          GH_TOKEN: ${{ secrets.SETUP_TOKEN }}
        run: |
          echo "Listing secrets:"
          gh secret list --repo ryoustream/RyouPlayer
